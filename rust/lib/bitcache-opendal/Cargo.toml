# See: https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "bitcache-opendal"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
#documentation.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[features]
default = ["all", "std"]
all = []
alloc = ["bitcache-core/alloc"]
std = ["alloc", "bitcache-core/std"]
unstable = []

# Service backends (forwarded to the `opendal` crate). Services accessed
# over HTTP also enable OpenDAL's default (reqwest-based) HTTP transport.
# The umbrella `services` feature enables every service below:
services = [
    "azblob",
    "azdls",
    "b2",
    "cos",
    "dropbox",
    "fs",
    "ftp",
    "gcs",
    "gdrive",
    "http",
    "memcached",
    "memory",
    "mongodb",
    "mysql",
    "obs",
    "onedrive",
    "oss",
    "postgresql",
    "redis",
    "s3",
    "sftp",
    "sqlite",
    "swift",
    "webdav",
    "webhdfs",
]
azblob = ["opendal/services-azblob", "http-transport"]
azdls = ["opendal/services-azdls", "http-transport"]
b2 = ["opendal/services-b2", "http-transport"]
cos = ["opendal/services-cos", "http-transport"]
dropbox = ["opendal/services-dropbox", "http-transport"]
fs = ["opendal/services-fs"]
ftp = ["opendal/services-ftp"]
gcs = ["opendal/services-gcs", "http-transport"]
gdrive = ["opendal/services-gdrive", "http-transport"]
http = ["opendal/services-http", "http-transport"]
memcached = ["opendal/services-memcached"]
memory = ["opendal/services-memory"]
mongodb = ["opendal/services-mongodb"]
mysql = ["opendal/services-mysql"]
obs = ["opendal/services-obs", "http-transport"]
onedrive = ["opendal/services-onedrive", "http-transport"]
oss = ["opendal/services-oss", "http-transport"]
postgresql = ["opendal/services-postgresql"]
redis = ["opendal/services-redis"]
s3 = ["opendal/services-s3", "http-transport"]
sftp = ["opendal/services-sftp"]
sqlite = ["opendal/services-sqlite"]
swift = ["opendal/services-swift", "http-transport"]
webdav = ["opendal/services-webdav", "http-transport"]
webhdfs = ["opendal/services-webhdfs", "http-transport"]

# OpenDAL's default HTTP transport, required by HTTP-based services:
http-transport = ["opendal/http-transport-reqwest"]

[dependencies]
bitcache-core = { workspace = true, features = ["tokio"] }
opendal = { version = "0.58", default-features = false }

[dev-dependencies]
opendal = { version = "0.58", default-features = false, features = ["services-memory"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
