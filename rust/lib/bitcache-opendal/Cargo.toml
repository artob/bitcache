# See: https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "bitcache-opendal"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
#documentation.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

# Preview locally with: RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc --all-features
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["all", "std"]
all = []
alloc = ["bitcache-core/alloc"]
std = ["alloc", "bitcache-core/std"]
unstable = []

# Service backends (forwarded to the `opendal` crate). Services accessed
# over HTTP also enable OpenDAL's default (reqwest-based) HTTP transport.
# The umbrella `services` feature enables every service below:
services = [
    "azblob",
    "fs",
    "ftp",
    "gcs",
    "http",
    "memcached",
    "memory",
    "mongodb",
    #"redb",
    "redis",
    #"rocksdb",
    "s3",
    "sftp",
    "sled",
    #"sqlite",
]
# Validated services:
azblob = ["opendal/services-azblob", "http-transport"]
fs = ["opendal/services-fs"]
ftp = ["opendal/services-ftp"]
gcs = ["opendal/services-gcs", "http-transport"]
http = ["opendal/services-http", "http-transport"]
memcached = ["opendal/services-memcached"]
memory = ["opendal/services-memory"]
mongodb = ["opendal/services-mongodb"]
#redb = ["opendal/services-redb"] # nontrivial to build
redis = ["opendal/services-redis"]
#rocksdb = ["opendal/services-rocksdb"] # nontrivial to build
s3 = ["opendal/services-s3", "http-transport"]
sftp = ["opendal/services-sftp"]
sled = ["opendal/services-sled"]
#sqlite = ["opendal/services-sqlite"]

# OpenDAL's default HTTP transport, required by HTTP-based services:
http-transport = ["opendal/http-transport-reqwest"]

[dependencies]
bitcache-core = { workspace = true, features = ["opendal"] }
opendal = { workspace = true, features = ["auto-register-services"] }

[dev-dependencies]
bitcache-core = { workspace = true, features = ["tokio"] }
opendal = { workspace = true, features = ["services-memory"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
