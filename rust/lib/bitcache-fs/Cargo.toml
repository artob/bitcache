# See: https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "bitcache-fs"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
#documentation.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

# Preview locally with: RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc --all-features
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["all", "std"]
all = ["tokio"]
alloc = ["bitcache-core/alloc"]
std = ["alloc", "bitcache-core/std", "cap-std/fs_utf8"]
unstable = []

# Interoperability:
tokio = ["std", "bitcache-core/tokio"]

[dependencies]
bitcache-core = { workspace = true, features = ["cap-std", "clientele"] }
cap-std = { workspace = true }

[target.'cfg(unix)'.dependencies]
xattr = { workspace = true }

[target.'cfg(windows)'.dependencies]
fsquirrel = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
