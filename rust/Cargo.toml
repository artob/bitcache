# See: https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.package]
version = "0.0.3"
authors = ["Arto Bendiken"]
edition = "2024"
rust-version = "1.91"
description = "Bitcache is a distributed content-addressable storage (CAS) system."
#documentation = "https://docs.rs/bitcache"
readme = true
homepage = "https://bitcache.dev"
repository = "https://github.com/artob/bitcache"
license = "Unlicense"
keywords = ["bitcache", "content-addressed", "content-addressable", "content-addressing"]
categories = ["command-line-utilities", "caching", "filesystem"]
publish = true

[workspace]
members = ["lib/*"]
resolver = "2"

[workspace.dependencies]
bitcache = { version = "=0.0.3", default-features = false }
bitcache-core = { version = "=0.0.3", default-features = false }
bitcache-fs = { version = "=0.0.3", default-features = false }
bitcache-git = { version = "=0.0.3", default-features = false }
bitcache-heap = { version = "=0.0.3", default-features = false }
bitcache-iroh = { version = "=0.0.3", default-features = false }
bitcache-opendal = { version = "=0.0.3", default-features = false }
bitcache-turso = { version = "=0.0.3", default-features = false }
bitcache-valkey = { version = "=0.0.3", default-features = false }

astral-tokio-tar = { version = "0.6", default-features = false }
async-compression = { version = "0.4", default-features = false }
cap-std = { version = "4.0", default-features = false }
clap = { version = "4.5", default-features = false, features = ["std"] }
clientele = { version = "0.3.9", default-features = false }
iroh = { version = "1.0", default-features = false }
fred = { version = "10.1", default-features = false, features = ["transactions"] }
fsquirrel = { version = "0.1.3", default-features = false }
gix = { version = "0.85", default-features = false, features = ["sha1"] }
opendal = { version = "0.58", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "system-proxy"] }
serde = { version = "1", default-features = false, features = ["derive"] }
thiserror = { version = "2", default-features = false }
tokio = { version = "1", default-features = false }
turso = { version = "0.7", default-features = false }
url = { version = "2.5", default-features = false }
xattr = { version = "1.6", default-features = false }

[patch.crates-io]
bitcache = { path = "lib/bitcache" }
bitcache-core = { path = "lib/bitcache-core" }
bitcache-fs = { path = "lib/bitcache-fs" }
bitcache-git = { path = "lib/bitcache-git" }
bitcache-heap = { path = "lib/bitcache-heap" }
bitcache-iroh = { path = "lib/bitcache-iroh" }
bitcache-opendal = { path = "lib/bitcache-opendal" }
bitcache-turso = { path = "lib/bitcache-turso" }
bitcache-valkey = { path = "lib/bitcache-valkey" }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
